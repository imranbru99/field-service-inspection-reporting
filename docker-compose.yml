services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: field-inspection-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: field_inspection
      DB_USERNAME: fieldsvc
      DB_PASSWORD: secret
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - field-inspection-net

  nginx:
    image: nginx:1.27-alpine
    container_name: field-inspection-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - field-inspection-net

  mysql:
    image: mysql:8.4
    container_name: field-inspection-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: field_inspection
      MYSQL_USER: fieldsvc
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3309:3306"
    volumes:
      - field_inspection_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - field-inspection-net

  redis:
    image: redis:7-alpine
    container_name: field-inspection-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    networks:
      - field-inspection-net

volumes:
  field_inspection_mysql_data:

networks:
  field-inspection-net:
    driver: bridge
